plugins {
    // Regular loom (obfuscated Minecraft -> yarn mappings) for 1.21.x
    id 'fabric-loom' version '1.18.2' apply false
    // Marker plugin: disables remapping, for the unobfuscated Minecraft 26.x line
    id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
}

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds NotGrindstone for every supported Minecraft version.'
    dependsOn provider {
        subprojects.findAll { it.hasProperty('mc.version') }.collect { it.tasks.named('build') }
    }
}