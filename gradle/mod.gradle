
def prop = { String key, Object fallback = null ->
    project.hasProperty(key) ? project.property(key) : fallback
}

def mc = [
        version      : prop('mc.version'),
        dependency   : prop('mc.minecraftDependency'),
        javaRelease  : prop('mc.javaRelease') as int,
        fabricApi    : prop('mc.fabricApi'),
        unobfuscated : prop('mc.unobfuscated', 'false') == 'true',
        api          : prop('mc.api'),
        triggerApi   : prop('mc.triggerApi', prop('mc.api')),
        yarn         : prop('mc.yarn'),
]

if (mc.unobfuscated) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

group = rootProject.property('maven_group')
version = "${rootProject.property('mod_version')}+mc${mc.version}"

base {
    archivesName = "${rootProject.property('archives_base_name')}-${mc.version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${mc.version}"

    if (mc.unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
        implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabricApi}"
    } else {
        mappings "net.fabricmc:yarn:${mc.yarn}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.fabricApi}"
    }
}

def shared = rootProject.file('shared')
def sharedPath = { String path -> new File(shared, path) }

sourceSets.main.java.srcDirs += ['common/java', "${mc.api}/java"].collect { sharedPath(it) }
sourceSets.main.resources.srcDir sharedPath("${mc.api}/resources")

// The advancement criterion API moved between Minecraft releases, so every distinct flavour of it
// lives in its own source set that only the versions speaking it add to the compilation.
if (mc.triggerApi != mc.api) {
    sourceSets.main.java.srcDir sharedPath("${mc.triggerApi}/java")
    sourceSets.main.resources.srcDir sharedPath("${mc.triggerApi}/resources")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(mc.javaRelease)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = mc.javaRelease
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

processResources {
    def tokens = [version: project.version.toString(), minecraft: mc.dependency]
    inputs.properties(tokens)
    filesMatching('fabric.mod.json') {
        expand tokens
    }
}

tasks.withType(Jar).configureEach {
    def license = rootProject.file('LICENSE.txt')
    if (license.exists()) {
        from(license) { rename { "${it}_${rootProject.property('archives_base_name')}" } }
    }
}
